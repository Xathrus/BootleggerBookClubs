{% extends "base.html" %}
{% block title %}Log in — Bootlegger{% endblock %}
{% block content %}
<div class="form-card form-card-narrow">
  <span class="eyebrow eyebrow-accent">Members only</span>
  <h1>Log in</h1>
  <p class="muted">Club members can log in to manage their club's books. No login is needed just to browse.</p>
  <form method="post">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username"
           autocapitalize="none" autofocus required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button class="btn btn-brass btn-wide" type="submit">Log in</button>
  </form>
  <p class="muted small" style="margin-top:1rem">Don't have a login? Ask the admin to set one up for you.</p>
</div>
{% endblock %}
