{% extends "base.html" %}
{% block title %}Change password — Bootlegger{% endblock %}
{% block content %}
<div class="form-card form-card-narrow">
  <span class="eyebrow eyebrow-accent">{{ person.name }}</span>
  <h1>Change password</h1>
  <form method="post">
    <label for="current_password">Current password</label>
    <input type="password" id="current_password" name="current_password"
           autocomplete="current-password" autofocus required>

    <label for="new_password">New password <span class="muted">(6+ characters)</span></label>
    <input type="password" id="new_password" name="new_password"
           autocomplete="new-password" minlength="6" required>

    <label for="confirm_password">New password again</label>
    <input type="password" id="confirm_password" name="confirm_password"
           autocomplete="new-password" minlength="6" required>

    <button class="btn btn-brass btn-wide" type="submit">Change password</button>
  </form>
</div>
{% endblock %}
