# Household Hub configuration
# Copy this file to config.yml and fill in your own values.
# The app re-reads this file every 30 seconds, so edits apply without a restart.

title: "Household Hub"

# Times are displayed in this timezone.
timezone: "America/Chicago"

# One entry per Google Calendar. Use each calendar's SECRET iCal address:
#   Google Calendar (web) -> Settings -> pick the calendar ->
#   "Integrate calendar" -> "Secret address in iCal format"
# Treat these URLs like passwords — anyone with the URL can read the calendar.
calendars:
  - name: "Eric"
    color: "#2E6E8E"   # left bar + dot color for this calendar's events
    ics_url: "https://calendar.google.com/calendar/ical/PASTE-SECRET-ADDRESS-1/basic.ics"

  - name: "Family"
    color: "#7A4E8E"
    ics_url: "https://calendar.google.com/calendar/ical/PASTE-SECRET-ADDRESS-2/basic.ics"

# Meal plan from AnyList, shown as a "Meals this week" card.
# Getting the link: AnyList -> Meal Plan tab -> More Actions (...) ->
#   Email, Print, Share & Subscribe -> Subscribe in External Apps ->
#   turn on External Calendar App Integration -> Copy Calendar Link.
# The link starts with https://icalendar.anylist.com — if your device gives
# you a webcal:// link instead, just change webcal:// to https://.
# Delete this section (or leave ics_url blank) to hide the meals card.
meals:
  ics_url: "https://icalendar.anylist.com/PASTE-YOUR-LINK"

# Book club due dates, pulled from the Bootlegger Book Club Tracker.
# Leave api_url blank (or delete this whole section) to hide the book card.
bookclub:
  api_url: "http://bookclub-tracker.local:5000"   # base URL of the tracker, no trailing path
  api_token: "paste-a-long-random-token-here"     # must match HUB_API_TOKEN in the tracker
  days: 7
  # Only show books for these people (matches the tracker's person names).
  # Delete or empty this list to show everyone.
  people:
    - "Eric"
